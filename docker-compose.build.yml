# Build the image from source instead of pulling it from GHCR:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The locally built container is excluded from Watchtower updates.
services:
  seogeo:
    build:
      context: .
      args:
        VERSION: local
    image: seogeo:local
    labels:
      com.centurylinklabs.watchtower.enable: "false"
