name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please remove any private data (passwords, tokens, client figures) before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the home page or by `seogeo version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How do you run it?
      options:
        - Docker (docker compose)
        - Binary (seogeo serve)
        - CLI (render / import)
        - stdio (seogeo mcp)
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - claude.ai
        - Claude Desktop
        - Claude Code
        - Other / none
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs seogeo` (remove the password line)
      render: text
