name: Release

# - tag vX.Y.Z  -> tests, multi-arch image ghcr.io/flocom/seo-geo-report:{X.Y.Z, X.Y, latest},
#                  cross-compiled binaries attached to a GitHub Release.
# - push to main -> multi-arch image tagged "edge" (never "latest").
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/flocom/seo-geo-report

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          SEOGEO_SKIP_CHROME_TEST: "1" # PDF export is checked inside the image by CI

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Helper images come from mirror.gcr.io: Docker Hub rate limits and auth
      # outages must not break releases.
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=SEO & GEO Report
            org.opencontainers.image.description=Bilingual SEO, GA4 and GEO visibility reports - MCP server for claude.ai, HTML and PDF export
            org.opencontainers.image.source=https://github.com/flocom/SEO-GEO-Report
            org.opencontainers.image.url=https://github.com/flocom/SEO-GEO-Report
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          attests: type=sbom,generator=mirror.gcr.io/docker/buildkit-syft-scanner:stable-1

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              name="seogeo_${version}_${os}_${arch}"
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "build/$name/seogeo${ext}" ./cmd/seogeo
              cp README.md LICENSE "build/$name/"
              if [ "$os" = "windows" ]; then
                (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
